[package]
name = "ollama-controls-api"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[[bin]]
name = "ollama-api"
path = "src/bin/ollama-api.rs"

[dependencies]
age = "0.11"
argon2 = "0.5"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "6"
dotenvy = "0.15"
ollama-controls = { path = "../ollama-controls" }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
tempfile = "3"
